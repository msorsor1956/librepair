services:
  - type: web
    name: librepair-backend
    runtime: node
    buildCommand: "npm install -g bun && cd packages/web && bun install && bun run build"
    startCommand: "cd packages/web && bun run db:migrate:deploy && bun src/server.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: WEBSITE_URL
        sync: false
      - key: VITE_FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
